# GitHub Actions CI Pipeline
# Runs linting, type checking, unit/integration tests, coverage, and
# performance benchmarks on every push/PR.
#
# CI gate thresholds are documented in CI_GATES.md.

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check src tests
      - name: Run ruff format check
        run: ruff format --check src tests
      - name: Run ruff on new Wave-2 modules (perception, messaging, benchmark, governance)
        run: |
          for path in \
            src/apex_autopilot_optimization/perception \
            src/apex_autopilot_optimization/messaging \
            src/apex_autopilot_optimization/governance \
            src/apex_autopilot_optimization/benchmark.py; do
            [ -e "$path" ] && ruff check "$path"
          done

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mypy
        run: mypy src
      - name: Run mypy on new Wave-2 modules
        run: |
          for path in \
            src/apex_autopilot_optimization/perception \
            src/apex_autopilot_optimization/messaging \
            src/apex_autopilot_optimization/governance \
            src/apex_autopilot_optimization/benchmark.py; do
            [ -e "$path" ] && mypy "$path"
          done

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -v --tb=short
      - name: Run CLI tests
        run: pytest tests/unit/test_cli.py -v
      - name: Run new-module tests (perception, messaging, benchmark, wta_solver, swarm_runner)
        run: pytest tests/unit/test_perception.py tests/unit/test_messaging.py tests/unit/test_benchmark.py tests/unit/test_wta_solver.py tests/unit/test_swarm_runner.py -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests
        run: pytest tests/integration -v --tb=short

  coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=term --cov-fail-under=85
      - name: Verify new-module coverage >= 80% (perception)
        run: pytest tests/unit/test_perception.py --cov=apex_autopilot_optimization.perception --cov-report=term --cov-fail-under=80 -q
      - name: Verify new-module coverage >= 80% (benchmark)
        run: pytest tests/unit/test_benchmark.py --cov=apex_autopilot_optimization.benchmark --cov-report=term --cov-fail-under=80 -q
      - name: Verify new-module coverage >= 80% (messaging queue/stream/event_store)
        run: pytest tests/unit/test_messaging.py --cov=apex_autopilot_optimization.messaging.queue --cov=apex_autopilot_optimization.messaging.stream --cov=apex_autopilot_optimization.messaging.event_store --cov-report=term --cov-fail-under=80 -q
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run performance benchmarks (perception latency + WTA solve time)
        run: python scripts/ci_performance_gate.py
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: .benchmarks/ci_*.json
          if-no-files-found: error
