global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: apex-autopilot-optimization

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: apex-swarm
    static_configs:
      - targets:
          - swarm-metrics:9090
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
