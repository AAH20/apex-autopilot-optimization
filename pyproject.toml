[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apex-autopilot-optimization"
version = "0.1.0"
description = "Unified macro architecture for UAV/UAS and ground vehicle autopilot optimization"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.11"
authors = [
    { name = "Ahmed Hassan", email = "aah@a2zsoc.com" },
]
keywords = ["autopilot", "uav", "uas", "ardupilot", "px4", "optimization", "path-planning", "trajectory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.12.0,<2.0.0",
    "networkx>=3.2.0,<4.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "structlog>=24.1.0,<25.0.0",
    "typer>=0.12.0,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.3.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "hypothesis>=6.98.0,<7.0.0",
]
viz = [
    "matplotlib>=3.8.0,<4.0.0",
    "plotly>=5.18.0,<6.0.0",
]
sim = [
    "gymnasium>=0.29.0,<1.0.0",
]

[project.scripts]
apex-autopilot = "apex_autopilot_optimization.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_autopilot_optimization"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_chaos.py" = ["F841"]
"tests/unit/test_compliance.py" = ["F841"]
"tests/unit/test_formal.py" = ["E402"]
"tests/unit/test_persistence.py" = ["N814", "N817"]
"tests/unit/test_realtime.py" = ["F841"]
"tests/unit/test_tracing.py" = ["F841"]
"tests/unit/test_keymgmt.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "yaml.*", "rclpy.*", "geometry_msgs.*", "std_srvs.*", "nav_msgs.*", "sensor_msgs.*", "cyclonedds.*", "fastdds.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
